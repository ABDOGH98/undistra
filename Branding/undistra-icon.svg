<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Undistra</title>
  <defs>
    <linearGradient id="bg" x1="140" y1="100" x2="884" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A45"/><stop offset=".5" stop-color="#FF2D7A"/><stop offset="1" stop-color="#7A3CF0"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="100" x2="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="545" r="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".35"/></filter>
    <filter id="uShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#3A0A4A" flood-opacity=".25"/></filter>
    <filter id="dotGlow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="22" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#tileShadow)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#light)"/>
    <circle cx="512" cy="545" r="270" fill="url(#glow)"/>
    <g fill="#fff" fill-opacity=".42">
      <circle cx="236" cy="268" r="17"/><circle cx="796" cy="240" r="23"/><circle cx="846" cy="430" r="12"/>
      <circle cx="192" cy="478" r="11"/><circle cx="812" cy="700" r="15"/>
    </g>
  </g>
  <path d="M352 300V560A160 160 0 0 0 672 560V300" fill="none" stroke="#fff" stroke-width="92" stroke-linecap="round" filter="url(#uShadow)"/>
  <circle cx="512" cy="545" r="64" fill="#fff" filter="url(#dotGlow)"/>
